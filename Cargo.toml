[package]
name = "rully"
version = "0.1.0"
edition = "2024"

[lib]
name = "rully_core"

[dependencies]
base64 = "0.22"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13", features = ["gzip"] }
tokio = { version = "1", features = ["full"] }
serde_json = { version = "1", features = ["preserve_order"] }
ratatui = "0.30"
crossterm = "0.29.0"
tui-input = "0.15.5"
ratatui-textarea = "0.9.3"
